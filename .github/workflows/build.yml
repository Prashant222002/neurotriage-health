name: Midnight Build

# SHORT ONLY (round 4). The Long video has its own workflow: build_long.yml. Both share one concurrency group,
# so two videos are never built at the same time.
# 00:00 IST main build. 02:00 and 04:00 IST are CATCH-UPS: if GitHub started the 00:00 run late, was busy,
# or the build died, they pick up the checkpoints and finish it. If today's video is already built they exit in seconds.
on:
  schedule:
    - cron: "30 18 * * *"    # 00:00 IST
    - cron: "30 20 * * *"    # 02:00 IST catch-up
    - cron: "30 22 * * *"    # 04:00 IST catch-up
  workflow_dispatch:
    inputs:
      publish_when:
        description: "scheduled = schedule time par live | now = TURANT PUBLIC publish (privacy ignore)"
        type: choice
        options: [scheduled, now]
        default: scheduled
      publish_time_ist:
        description: "Schedule time IST, HH:MM (khali = Short 10:00, Long 19:00). Aaj ka time nikal gaya ho to agla din."
        required: false
        default: ""
      publish_asap:
        description: "Schedule ignore karo, ~25 min baad publish (1 = haan)"
        required: false
        default: ""
      unlock_script:
        description: "Aaj ki locked script hatakar nayi banao (1 = haan). Sirf tumhari permission se script badalti hai."
        required: false
        default: ""
      force_rebuild:
        description: "Aaj ka video pehle ban chuka ho tab bhi dobara banao (1 = haan)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: midnight-build
  cancel-in-progress: false      # a late catch-up waits; it never kills a slow build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330          # GitHub's hard limit is 360. Slow is fine, we are not in a hurry at midnight.
    steps:
      - uses: actions/checkout@v4

      - name: IST date
        id: d
        run: echo "date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages (ffmpeg + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-montserrat fonts-noto-core

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Restore checkpoints (resume a half-done build)
        uses: actions/cache/restore@v4
        with:
          path: |
            work/ckpt
            work/long_seg
          key: ckpt-${{ steps.d.outputs.date }}-${{ github.run_id }}
          restore-keys: ckpt-${{ steps.d.outputs.date }}-

      - name: Restore footage cache (stock clips + search results from earlier runs)
        uses: actions/cache/restore@v4
        with:
          path: work/footage
          key: footage-${{ github.run_id }}
          restore-keys: footage-

      - name: API key health check (which keys work, which secrets are named wrong)
        continue-on-error: true
        env:
          ALL_SECRETS_JSON: ""
        run: python healthcheck.py

      - name: Build (3 attempts, resumes from checkpoints)
        env:
          # every secret, so GROQ_API_KEY_3..10 / ELEVEN_API_KEY_1..10 / XAI_... work without     run: |
          git config user.name "reel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add topics_done.txt queue/ state/ 2>/dev/null || true
          git commit -m "build: topic log + queue manifests" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break || sleep 6; donequeue manifests
        if: always()
        run: |
          git config user.name "reel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add topics_done.txt queue/ state/ 2>/dev/null || true
          git commit -m "build: topic log + queue manifests" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break || sleep 6; donenothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break || sleep 6; done
