name: Daily Reel

on:
  schedule:
    - cron: "30 4 * * *"   # 4:30 UTC = 10:00 AM India
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages (ffmpeg + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-montserrat fonts-noto-core

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Make video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}         # PRIMARY (research + script)
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}     # optional backup Groq key
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}     # FALLBACK (Groq fail ho to)
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}  # optional backup keys (alag Google project se)
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}     # optional: stock clips
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}   # optional: stock clips
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: private        # review ke baad "public" kar dena
          VOICE: "en-US-AndrewMultilingualNeural"   # ya en-US-AvaMultilingualNeural, en-US-BrianMultilingualNeural
          MODE: auto               # auto | awareness | student
          MUSIC: "on"              # "off" karoge to background music band
          BRAND_NAME: "NeuroTriage"
          SITE_URL: "https://www.neurotriage.in/"
          SITE_SHORT: "neurotriage.in"
          TAGLINE: "Free screening  |  Productivity tools"
        run: python bot.py

      - name: Save video (download karke dekh sakte ho)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: |
            output/final_reel.mp4
            output/meta.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Save topic history
        if: success()
        run: |
          git config user.name "reel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add topics_done.txt
          git commit -m "topic log" || echo "nothing to commit"
          git push
