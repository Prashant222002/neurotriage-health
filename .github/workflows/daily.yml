name: Daily Reel

on:
  schedule:
    - cron: "30 4 * * *"   # 4:30 UTC = 10:00 AM India
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages (ffmpeg + Hindi font + text shaping)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0 libharfbuzz0b

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Make video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: private        # review ke baad "public" kar dena
          VOICE: "en-US-AndrewMultilingualNeural"   # ya en-US-AvaMultilingualNeural, en-IN-NeerjaNeural
          MODE: auto               # auto | awareness | student
          BRAND_NAME: "NeuroTriage"
          SITE_URL: "https://www.neurotriage.in/"
          SITE_SHORT: "neurotriage.in"
          TAGLINE: "Free screening  |  Productivity tools"
        run: python bot.py

      - name: Save video (download karke dekh sakte ho)
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: |
            output/final_reel.mp4
            output/meta.json
          retention-days: 14

      - name: Save topic history
        run: |
          git config user.name "reel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add topics_done.txt
          git commit -m "topic log" || echo "nothing to commit"
          git push
