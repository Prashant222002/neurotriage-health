name: Midnight Build
run-name: "${{ github.event.inputs.topic && format('Topic: {0}', github.event.inputs.topic) || github.workflow }}"

# SHORT ONLY (round 4). The Long video has its own workflow: build_long.yml. Both share one concurrency group,
# so two videos are never built at the same time.
# 00:00 IST main build. 02:00 and 04:00 IST are CATCH-UPS: if GitHub started the 00:00 run late, was busy,
# or the build died, they pick up the checkpoints and finish it. If today's video is already built they exit in seconds.
on:
  schedule:
    - cron: "30 18 * * *"    # 00:00 IST
    - cron: "30 20 * * *"    # 02:00 IST catch-up
    - cron: "30 22 * * *"    # 04:00 IST catch-up
  workflow_dispatch:
    inputs:
      topic:
        description: "APNA TOPIC (khali = automatic topic). Isi topic par research + stock footage se video banega"
        required: false
        default: ""
      topic_notes:
        description: "Topic ke saath extra instruction (optional): angle, audience, kya dikhana hai"
        required: false
        default: ""
      publish_when:
        description: "scheduled = schedule time par live | now = TURANT PUBLIC publish (privacy ignore)"
        type: choice
        options: [scheduled, now]
        default: scheduled
      publish_time_ist:
        description: "Schedule time IST, HH:MM (khali = Short 10:00, Long 19:00). Aaj ka time nikal gaya ho to agla din."
        required: false
        default: ""
      publish_asap:
        description: "Schedule ignore karo, ~25 min baad publish (1 = haan)"
        required: false
        default: ""
      unlock_script:
        description: "Aaj ki locked script hatakar nayi banao (1 = haan). Sirf tumhari permission se script badalti hai."
        required: false
        default: ""
      force_rebuild:
        description: "Aaj ka video pehle ban chuka ho tab bhi dobara banao (1 = haan)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: midnight-build
  cancel-in-progress: false      # a late catch-up waits; it never kills a slow build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330          # GitHub's hard limit is 360. Slow is fine, we are not in a hurry at midnight.
    steps:
      - uses: actions/checkout@v4

      - name: IST date
        id: d
        run: echo "date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages (ffmpeg + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-montserrat fonts-noto-core

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Restore checkpoints (resume a half-done build)
        uses: actions/cache/restore@v4
        with:
          path: |
            work/ckpt
            work/long_seg
          key: ckpt-${{ steps.d.outputs.date }}-${{ github.run_id }}
          restore-keys: ckpt-${{ steps.d.outputs.date }}-

      - name: Restore footage cache (stock clips + search results from earlier runs)
        uses: actions/cache/restore@v4
        with:
          path: work/footage
          key: footage-${{ github.run_id }}
          restore-keys: footage-

      - name: API key health check (which keys work, which secrets are named wrong)
        continue-on-error: true
        env:
          ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
          IG_GRAPH_HOST: ${{ secrets.IG_GRAPH_HOST || 'graph.facebook.com' }}
        run: python healthcheck.py

      - name: Build (3 attempts, resumes from checkpoints)
        env:
          # every secret, so GROQ_API_KEY_3..10 / ELEVEN_API_KEY_1..10 / XAI_... work without editing this file
          ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
          # ---- LLM (research + script) ----
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          # ---- Voice: ElevenLabs (10 keys, auto-rotate) ----
          ELEVEN_HINDI_VOICE_IDS: ${{ secrets.ELEVEN_HINDI_VOICE_IDS }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          ELEVEN_API_KEY_1: ${{ secrets.ELEVEN_API_KEY_1 }}
          ELEVEN_API_KEY_2: ${{ secrets.ELEVEN_API_KEY_2 }}
          ELEVEN_API_KEY_3: ${{ secrets.ELEVEN_API_KEY_3 }}
          ELEVEN_API_KEY_4: ${{ secrets.ELEVEN_API_KEY_4 }}
          ELEVEN_API_KEY_5: ${{ secrets.ELEVEN_API_KEY_5 }}
          ELEVEN_API_KEY_6: ${{ secrets.ELEVEN_API_KEY_6 }}
          ELEVEN_API_KEY_7: ${{ secrets.ELEVEN_API_KEY_7 }}
          ELEVEN_API_KEY_8: ${{ secrets.ELEVEN_API_KEY_8 }}
          ELEVEN_API_KEY_9: ${{ secrets.ELEVEN_API_KEY_9 }}
          ELEVEN_API_KEY_10: ${{ secrets.ELEVEN_API_KEY_10 }}
          ELEVEN_VOICE_IDS: ${{ secrets.ELEVEN_VOICE_IDS }}
          # ---- Stock clips + viral research ----
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          # ---- Publishing (empty = that platform is skipped) ----
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ secrets.IG_GRAPH_HOST || 'graph.facebook.com' }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          # ---- Schedule ----
          LONG_VOICE: local                   # local = Long video uses free English TTS (saves ElevenLabs). eleven = Hinglish ElevenLabs
          ELEVEN_FALLBACK: english            # english = if ElevenLabs fails, use English TTS (with a loud warning). fail = stop instead
          # Round 3: normal (automatic) runs make a SHORT only. Run workflow -> video_type = long / both for a Long video.
          VIDEO_TYPE: short                   # this workflow never builds a Long video (see build_long.yml)
          AUTO_LONG: "off"
          UNLOCK_SCRIPT: ${{ github.event.inputs.unlock_script }}
          QUEUE_MODE: ${{ github.event.inputs.publish_when == 'now' && 'off' || 'on' }}   # off = publish immediately after the build
          PUBLISH_TIME_SHORT_IST: ${{ github.event.inputs.publish_time_ist || '10:00' }}   # Short goes live (YouTube + Facebook + Instagram)
          PUBLISH_TIME_LONG_IST: "19:00"
          LOGO: "on"                          # off = no logo anywhere
          PUBLISH_ASAP: ${{ github.event.inputs.publish_asap }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
          NATIVE_SCHEDULE: "on"               # YouTube + Facebook schedule themselves; Instagram posted by publish.yml
          CYCLE_START: "2026-11-01"           # day 1 of the 7-day loop; day 7 = short + long video
          FORCE_LONG: ""
          # ---- Quality / look ----
          RENDER_PRESET: "slow"               # Short: slow encode = better quality (time is not a problem at midnight)
          LONG_PRESET: "medium"
          LONG_FPS: "24"
          LONG_RENDER: "on"                   # off = only the long script kit
          LONG_VISION: "on"                   # Gemini picks the best stock clip per long-video scene
          CAPTION_STYLE: "auto"               # auto (rotates daily) | pop | box | karaoke | bounce | glow
          # ---- Misc ----
          # PRIVACY public = video goes live at the scheduled time by itself (YouTube publishAt). private = it never goes live.
          PRIVACY: public
          VOICE: "en-US-AndrewMultilingualNeural"   # English fallback voice only
          MODE: auto
          MUSIC: "on"
          BRAND_NAME: "NeuroTriage"
          SITE_URL: "https://www.neurotriage.in/"
          SITE_SHORT: "neurotriage.in"
          TAGLINE: "Free screening  |  Productivity tools"
          MANUAL_TOPIC: ${{ github.event.inputs.topic }}
          MANUAL_NOTES: ${{ github.event.inputs.topic_notes }}
          MANUAL_ID: ${{ github.event.inputs.topic && format('m{0}', github.run_id) || '' }}
          PUBLISH_TIME_SHORT_FORCE: ${{ github.event.inputs.publish_time_ist }}   # time typed on dashboard beats the learned best-time
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ok=0
          for attempt in 1 2 3; do
            echo "::group::attempt $attempt"
            if python bot.py; then ok=1; echo "::endgroup::"; break; fi
            echo "::endgroup::"
            echo "attempt $attempt failed, waiting 2 min and resuming from checkpoints"
            sleep 120
          done
          [ "$ok" = "1" ]

      - name: Save checkpoints
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            work/ckpt
            work/long_seg
          key: ckpt-${{ steps.d.outputs.date }}-${{ github.run_id }}

      - name: Save footage cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/footage
          key: footage-${{ github.run_id }}

      - name: Which day is in the queue?
        id: qk
        if: always()
        run: |
          if [ -f output/queue_key.txt ]; then echo "key=$(cat output/queue_key.txt)" >> "$GITHUB_OUTPUT"; fi

      - name: Queue artifact - Short
        if: always() && steps.qk.outputs.key != ''
        uses: actions/upload-artifact@v4
        with:
          name: queue-${{ steps.qk.outputs.key }}-short
          path: output/queue/${{ steps.qk.outputs.key }}/short
          retention-days: 7
          if-no-files-found: ignore

      - name: Queue artifact - Long (never used here)
        if: always() && steps.qk.outputs.key != ''
        uses: actions/upload-artifact@v4
        with:
          name: queue-${{ steps.qk.outputs.key }}-long
          path: output/queue/${{ steps.qk.outputs.key }}/long
          retention-days: 7
          if-no-files-found: ignore

      - name: Download - final Short video (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHORT-VIDEO-${{ github.run_id }}
          path: |
            output/final_reel*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Debug files (meta + report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: |
            state/*.json
            output/meta.json
            output/step_report.json
            output/publish_report.json
            output/long/long_meta.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Save topic history + queue manifests
        if: always()
        run: |
          git config user.name "reel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add topics_done.txt queue/ state/ 2>/dev/null || true
          git commit -m "build: topic log + queue manifests" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break || sleep 6; done
