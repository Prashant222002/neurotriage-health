<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b1020"><link rel="icon" href="icon.png">
<title>NeuroTriage Control</title>
<style>
:root{--bg:#0b1020;--card:#151c33;--tx:#e8ecff;--mu:#8a93b8;--ac:#6c8cff;--ok:#3ecf8e;--bad:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:14px;max-width:560px;margin:auto}
h1{font-size:19px}h2{font-size:15px;margin:0 0 8px}.c{background:var(--card);border-radius:14px;padding:14px;margin:12px 0}
input,select{width:100%;padding:10px;margin:4px 0 8px;border-radius:9px;border:1px solid #2a3560;background:#0e1427;color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-weight:600;width:100%;margin-top:4px}
button.s{background:#222c52}.r{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid #222c52;font-size:13px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mu{color:var(--mu);font-size:12px}a{color:var(--ac)}#msg{min-height:20px;font-size:13px}
</style></head><body>
<h1>NeuroTriage Control</h1>
<div class="mu"><a href="/auto">&rarr; Auto dashboard (apna topic, progress, manual upload info)</a></div>
<div class="c"><input id="pw" type="password" placeholder="Password"><div id="msg" class="mu"></div></div>

<div class="c"><h2>Short video</h2><button onclick="go('build.yml',{})">Build Short now</button></div>

<div class="c"><h2>Long video</h2>
<select id="eng"><option value="auto">Voice: auto (ElevenLabs 2-3 min, then free)</option><option value="eleven">ElevenLabs only</option><option value="local">Free TTS (full length)</option></select>
<input id="vid" placeholder="ElevenLabs voice id (optional)"><input id="edge" placeholder="Free voice e.g. en-US-AvaMultilingualNeural (optional)">
<button onclick="go('build_long.yml',{voice_engine:v('eng'),eleven_voice_id:v('vid'),edge_voice:v('edge')})">Build Long now</button>
<div class="mu">Auto: every Sunday night.</div></div>

<div class="c"><h2>Edit raw video</h2>
<input id="rv" placeholder="Video: direct https link or raw/clip.mp4"><input id="ra" placeholder="Own audio: link or raw/audio.mp3 (optional)">
<input id="rh" placeholder="Hook text (optional)">
<select id="rm"><option>auto</option><option>crop</option><option>blur</option><option>none</option></select>
<input id="up" type="file" accept="audio/*,video/*"><button class="s" onclick="upl()">Upload small file (max ~3 MB) -> raw/</button>
<button onclick="go('edit_raw.yml',{video:v('rv'),audio:v('ra'),hook:v('rh'),method:v('rm')})">Edit video</button></div>

<div class="c"><h2>Talking-head edit (Round 8)</h2>
<input id="tv" placeholder="Raw talking video: https link or raw/clip.mp4"><input id="ti" placeholder="Screen recordings/images (optional, comma separated; name = topic)">
<input id="th" placeholder="Hook (optional, AI picks)"><select id="ts"><option>red</option><option>white</option></select>
<button onclick="go('talking_head.yml',{video:v('tv'),inserts:v('ti'),hook:v('th'),style:v('ts')})">Make talking-head reel</button></div>
<div class="c"><h2>Other</h2><button class="s" onclick="go('publish.yml',{})">Publish due videos</button>
<button class="s" onclick="go('analytics.yml',{})">Re-check best posting time</button></div>

<div class="c"><h2>Status <span class="mu" id="t"></span></h2><div id="runs" class="mu">Enter password...</div><button class="s" onclick="st()">Refresh</button></div>
<script>
const $=id=>document.getElementById(id),v=id=>$(id).value.trim();
const H=()=>({"x-pass":v("pw"),"Content-Type":"application/json"});
if(localStorage.pw)$("pw").value=localStorage.pw;
async function api(u,o){const r=await fetch(u,o);let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||r.status);return j}
async function go(w,i){localStorage.pw=v("pw");$("msg").textContent="Starting...";
 try{await api("/api/run",{method:"POST",headers:H(),body:JSON.stringify({workflow:w,inputs:i})});$("msg").textContent="Started. Status below updates in ~20s.";setTimeout(st,20000)}catch(e){$("msg").textContent="Error: "+e.message}}
async function upl(){const f=$("up").files[0];if(!f)return;if(f.size>3e6){$("msg").textContent="File too big: paste a link";return}
 const b=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(",")[1]);x.readAsDataURL(f)});
 try{const j=await api("/api/upload",{method:"POST",headers:H(),body:JSON.stringify({name:f.name,b64:b})});$("msg").textContent="Uploaded: "+j.path;$("rv").value=f.type.startsWith("video")?j.path:$("rv").value;if(f.type.startsWith("audio"))$("ra").value=j.path}catch(e){$("msg").textContent="Error: "+e.message}}
async function st(){try{const j=await api("/api/status",{headers:H()});localStorage.pw=v("pw");
 $("runs").innerHTML=j.runs.map(r=>{const c=r.status!=="completed"?"running...":r.conclusion;const k=c==="success"?"ok":(c==="running..."?"":"bad");
  return `<div class="r"><div><a href="${r.url}" target="_blank">${r.name}</a><br><span class="mu">${new Date(r.at).toLocaleString()}</span></div><div style="text-align:right"><span class="${k}">${c}</span>${r.arts.map(a=>`<br><a href="/api/download?id=${a.id}&p=${encodeURIComponent(v("pw"))}">${a.name} (${a.mb} MB)</a>`).join("")}</div></div>`}).join("");
 $("t").textContent=new Date().toLocaleTimeString()}catch(e){$("runs").textContent="Error: "+e.message}}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
if(v("pw")){st();setInterval(st,60000)}
</script></body></html>
